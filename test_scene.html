<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>场景验证</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f7}canvas{display:block}</style>
<script type="importmap">
{"imports": {"three": "./vendor/three/three.module.js",
             "three/addons/": "./vendor/three/addons/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe8f7);
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 6000);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

{
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 32;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#eaf6ff'); grad.addColorStop(0.5, '#cfe8f7'); grad.addColorStop(0.75, '#c9d8c2'); grad.addColorStop(1, '#b6c4ae');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 32);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.environment = tex;
}
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0xb8c9b0, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(150, 220, -80);
scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xdfeaff, 0.6);
sun2.position.set(-120, 80, 100);
scene.add(sun2);

const loader = new GLTFLoader();
let n = 0;
loader.load('assets/airport.glb', (g) => { scene.add(g.scene); window.__airport = g.scene; done(); });
loader.load('assets/plane.glb', (g) => {
  const plane = g.scene;
  plane.position.set(143, 5.68, -950);   // 停机位 143
  scene.add(plane);
  plane.traverse(o => { if (/FanDisc/.test(o.name)) o.visible = false; });
  window.__plane = plane;
  done();
});
function done(){ if (++n === 2) window.__ready = true; }

const controls = new OrbitControls(cam, renderer.domElement);
const V = {
  apron:  {p:[180, 30, -880], t:[160, 6, -960]},   // 停机坪
  lineup: {p:[14, 6.5, 1135],  t:[0, 6, 950]},     // 跑道南端对正（向 -Z 看）
  tower:  {p:[230, 40, -770],  t:[80, 4, 700]},     // 塔台俯瞰跑道
  aerial: {p:[350, 500, -350], t:[0, 0, 300]},     // 空中俯瞰全场景
};
window.__setView = (name) => {
  const v = V[name] || V.aerial;
  cam.position.set(...v.p);
  controls.target.set(...v.t);
  controls.update();
  return !!V[name];
};
window.__setView(new URLSearchParams(location.search).get('view') || 'aerial');
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();
</script>
</body>
</html>
